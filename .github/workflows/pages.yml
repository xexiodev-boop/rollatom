name: playground

# Builds the engine and publishes `playground/` to GitHub Pages. The page imports the
# built module directly, so nothing here bundles and no build output is committed.
#
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Never publish a playground built from code that does not pass its own suite.
      - run: npm run check

      - run: npm run build

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp playground/index.html _site/index.html
          cp dist/index.js _site/rollatom.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
