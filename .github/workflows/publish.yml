name: Publish to npm

# Run it from the release tag, not from a branch: "Use workflow from" lists tags.
# A tag push does not publish on its own — releasing stays a deliberate act.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing (provenance included)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Without this, whatever version is committed ships, and a mis-bump ships silently.
      - name: Require a tag matching package.json
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$REF_TYPE" != tag ]; then
            echo "::error::Ran from $REF_TYPE $REF_NAME. Re-run it from tag v$version."
            exit 1
          fi
          if [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Tag $REF_NAME does not match package.json version $version."
            exit 1
          fi

      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm publish
