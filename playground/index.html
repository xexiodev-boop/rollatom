<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rollatom playground</title>
    <meta name="description" content="Write dice notation, validate it as you type, and roll it." />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfbfc;
        --panel: #ffffff;
        --ink: #1a1c20;
        --muted: #6b7280;
        --line: #e3e5e9;
        --accent: #3366cc;
        --ok: #2f7a43;
        --bad: #c0392b;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14161a;
          --panel: #1b1e24;
          --ink: #e8eaed;
          --muted: #9aa1ac;
          --line: #2b2f37;
          --accent: #7aa2f7;
          --ok: #6fbf83;
          --bad: #f2777a;
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 2rem 1rem 4rem;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      main { max-width: 46rem; margin: 0 auto; }

      h1 { font-size: 1.4rem; margin: 0 0 0.25rem; letter-spacing: -0.01em; }
      h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em;
           color: var(--muted); margin: 0 0 0.6rem; font-weight: 600; }

      .lede { color: var(--muted); margin: 0 0 1.75rem; }
      .lede a { color: var(--accent); }

      /* ── Input ─────────────────────────────────────────────────────────── */

      .entry { display: flex; gap: 0.5rem; }

      #notation {
        flex: 1;
        min-width: 0;
        padding: 0.7rem 0.85rem;
        font: 1.05rem/1.3 var(--mono);
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      #notation:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
      #notation.invalid { border-color: var(--bad); }

      #roll {
        padding: 0.7rem 1.4rem;
        font: 600 1rem/1.3 inherit;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      #roll:disabled { opacity: 0.4; cursor: not-allowed; }

      #status { min-height: 1.5rem; margin: 0.5rem 0 0; font: 0.875rem/1.5 var(--mono); }
      #status.ok { color: var(--ok); }
      #status.bad { color: var(--bad); }

      .examples { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 1.25rem 0 0; padding: 0; list-style: none; }
      .examples button {
        font: 0.8rem/1.2 var(--mono);
        color: var(--muted);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.3rem 0.7rem;
        cursor: pointer;
      }
      .examples button:hover { color: var(--ink); border-color: var(--accent); }

      /* ── Result ────────────────────────────────────────────────────────── */

      #result { margin-top: 2rem; }
      #result[hidden] { display: none; }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 1.1rem 1.25rem;
        margin-bottom: 1rem;
      }

      .total { display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; }
      .total b { font-size: 2.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
      .total span { color: var(--muted); font: 0.85rem/1.4 var(--mono); }

      .faces { display: flex; flex-wrap: wrap; gap: 0.5rem; }

      .face {
        min-width: 3.5rem;
        padding: 0.45rem 0.6rem;
        border: 1px solid var(--line);
        border-left: 3px solid var(--swatch, var(--line));
        border-radius: 7px;
        text-align: center;
      }
      .face b { display: block; font: 600 1.15rem/1.2 var(--mono); font-variant-numeric: tabular-nums; }
      .face small { display: block; margin-top: 0.15rem; color: var(--muted); font: 0.7rem/1.3 var(--mono); }
      .face.dropped { opacity: 0.45; }
      .face.dropped b { text-decoration: line-through; }
      .face .gone { text-decoration: line-through; }

      .subtotals { display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; }
      .subtotal { display: flex; align-items: center; gap: 0.45rem; font: 0.9rem/1.4 var(--mono); }
      .swatch { width: 0.7rem; height: 0.7rem; border-radius: 50%; flex: none; }

      footer { margin-top: 2.5rem; color: var(--muted); font-size: 0.85rem; }
      footer a { color: var(--accent); }
      code { font-family: var(--mono); font-size: 0.9em; }
    </style>
  </head>

  <body>
    <main>
      <h1>rollatom playground</h1>
      <p class="lede">
        Write a formula, watch it validate as you type, then roll it.
        The <a href="https://github.com/xexiodev-boop/rollatom/blob/main/docs/GRAMMAR.md">grammar spec</a> defines the notation.
      </p>

      <div class="entry">
        <label for="notation" hidden>Dice notation</label>
        <input
          id="notation"
          type="text"
          value="2d20kh1 + 5"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          placeholder="2d6 + 3"
          aria-describedby="status"
        />
        <button id="roll" type="button">Roll</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>

      <h2 style="margin-top: 1.5rem">Examples</h2>
      <ul class="examples" id="examples"></ul>

      <section id="result" hidden></section>

      <footer>
        Rolls happen in this page, using <code>crypto.getRandomValues</code>. Nothing is sent anywhere.
      </footer>
    </main>

    <script type="module">
      import { rollDice, validateDice } from "./rollatom.js";

      const field = document.getElementById("notation");
      const button = document.getElementById("roll");
      const status = document.getElementById("status");
      const result = document.getElementById("result");

      const EXAMPLES = [
        "2d20kh1 + 5",
        "4d6dl1",
        "6d6ko5c",
        "3d10!o9ko8c",
        "(1d8* + 1d6*)kh1",
        "(2d8+3)s/2",
        "10d[-1,0x6,1x3]",
        "d[10..60:10] + d6",
        "2d6{#red,'fire'} + 1d8{'cold'}",
        "(1d12{'hope'} + 1d12{'fear'})i",
      ];

      // ── Validation, debounced ──────────────────────────────────────────────

      let timer;
      const DEBOUNCE_MS = 250;

      function validateNow() {
        const notation = field.value.trim();
        if (!notation) {
          status.textContent = "";
          status.className = "";
          field.classList.remove("invalid");
          button.disabled = true;
          return;
        }
        const error = validateDice(notation);
        button.disabled = error !== null;
        field.classList.toggle("invalid", error !== null);
        status.textContent = error ? error.message : "valid";
        status.className = error ? "bad" : "ok";
      }

      field.addEventListener("input", () => {
        clearTimeout(timer);
        timer = setTimeout(validateNow, DEBOUNCE_MS);
      });

      // ── Rolling ────────────────────────────────────────────────────────────

      function roll() {
        clearTimeout(timer);
        validateNow();
        if (button.disabled) return;
        try {
          render(rollDice(field.value.trim()));
        } catch (error) {
          // A formula can validate and still hit a cap only the dice decide.
          result.hidden = true;
          status.textContent = error.message;
          status.className = "bad";
        }
      }

      button.addEventListener("click", roll);
      field.addEventListener("keydown", (event) => {
        if (event.key === "Enter") roll();
      });

      // ── Rendering ──────────────────────────────────────────────────────────

      const el = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      };

      // The source line under a face: which die it came from, or what it is instead.
      function describe(face) {
        if (face.faces) return `d${face.faces}`;
        if (face.sealed) return "sealed";
        return "constant";
      }

      function faceCard(face) {
        const card = el("div", face.dropped ? "face dropped" : "face");
        if (face.color) card.style.setProperty("--swatch", face.color);

        card.append(el("b", null, face.label ?? String(face.value)));
        card.append(el("small", null, describe(face)));

        // A vertical explosion sums a chain into one seat; show what it summed.
        if (face.history.length > 1) card.append(el("small", null, face.history.join(" + ")));
        if (face.rerolls) card.append(el("small", "gone", face.rerolls.join(" ")));
        if (face.name) card.append(el("small", null, face.name));
        if (face.label !== undefined && face.faces) card.append(el("small", null, `= ${face.value}`));

        return card;
      }

      function scaleText(scale) {
        if (!scale) return "";
        return scale.op === "x" ? ` (scaled x${scale.by})` : ` (scaled /${scale.by}${scale.up ? " up" : ""})`;
      }

      function render(roll) {
        result.replaceChildren();

        const head = el("div", "card");
        const total = el("div", "total");
        total.append(el("b", null, String(roll.total)));
        total.append(el("span", null, `${roll.mode}${scaleText(roll.scale)} of ${roll.values.length} face${roll.values.length === 1 ? "" : "s"}`));
        head.append(total);
        result.append(head);

        const facesCard = el("div", "card");
        facesCard.append(el("h2", null, "Faces"));
        const faces = el("div", "faces");
        for (const face of roll.faces) faces.append(faceCard(face));
        facesCard.append(faces);
        result.append(facesCard);

        if (roll.subtotals) {
          const card = el("div", "card");
          card.append(el("h2", null, "Subtotals"));
          const list = el("div", "subtotals");
          for (const subtotal of roll.subtotals) {
            const row = el("div", "subtotal");
            const swatch = el("span", "swatch");
            swatch.style.background = subtotal.color;
            row.append(swatch, el("span", null, `${subtotal.label} ${subtotal.total}`));
            list.append(row);
          }
          card.append(list);
          result.append(card);
        }

        result.hidden = false;
      }

      // ── Examples ───────────────────────────────────────────────────────────

      const examples = document.getElementById("examples");
      for (const example of EXAMPLES) {
        const item = el("li");
        const chip = el("button", null, example);
        chip.type = "button";
        chip.addEventListener("click", () => {
          field.value = example;
          field.focus();
          roll();
        });
        item.append(chip);
        examples.append(item);
      }

      validateNow();
    </script>
  </body>
</html>
